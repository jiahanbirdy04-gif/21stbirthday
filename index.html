<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>happy 21st, noy 🕯️</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="frame" id="frame">

  <!-- ============ PAGE 1: LANDING — cake only ============ -->
  <section class="page is-active" id="page-landing" data-page="landing">
    <p class="landing-eyebrow">for noy — episode one</p>
    <button class="cake-tap-zone" id="landing-cake-btn" aria-label="Tap the cake to begin">
      <div class="cake-wrap" id="landing-cake">
        <!-- cake svg injected here by script.js (shared with finale) -->
      </div>
    </button>
    <p class="prompt-text">tap the cake</p>
  </section>

  <!-- ============ PAGE 2: MENU ============ -->
  <section class="page" id="page-menu" data-page="menu">
    <div class="menu-header">
      <h1 class="menu-title">happy 21st, noy</h1>
      <p class="menu-sub">pick where to start</p>
    </div>
    <div class="menu-grid">
      <button class="menu-card" data-goto="photos">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="18" height="15" rx="2"/><circle cx="8.5" cy="10.5" r="1.5"/><path d="M21 16l-5-5-9 9"/></svg>
        <span class="label">Photos</span>
      </button>
      <button class="menu-card" data-goto="music">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
        <span class="label">Music</span>
      </button>
      <button class="menu-card" data-goto="flowers">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="8" r="3"/><circle cx="7" cy="13" r="3"/><circle cx="17" cy="13" r="3"/><path d="M12 21v-7"/></svg>
        <span class="label">Flowers</span>
      </button>
      <button class="menu-card" data-goto="finale">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 2c0 2-2 3-2 5a2 2 0 0 0 4 0c0-2-2-3-2-5z"/><path d="M6 21v-7a6 6 0 0 1 12 0v7"/><path d="M4 21h16"/></svg>
        <span class="label">Cake</span>
      </button>
    </div>
  </section>

  <!-- ============ PAGE 3: PHOTOS ============ -->
  <section class="page" id="page-photos" data-page="photos">
    <div class="subpage-header">
      <button class="back-btn" data-back aria-label="Back to menu">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <h2 class="subpage-title">Photos</h2>
    </div>
    <div class="subpage-body">
      <div class="photo-grid" id="photo-grid"></div>
    </div>
  </section>

  <!-- ============ PAGE 4: MUSIC ============ -->
  <section class="page" id="page-music" data-page="music">
    <div class="subpage-header">
      <button class="back-btn" data-back aria-label="Back to menu">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <h2 class="subpage-title">Music</h2>
    </div>
    <div class="subpage-body">
      <div class="music-featured">
        <p class="music-featured-label">featured track</p>
        <p class="music-featured-title" id="featured-title"></p>
        <p class="music-featured-artist" id="featured-artist"></p>
        <div id="featured-embed-slot"></div>
      </div>
      <ul class="tracklist" id="tracklist"></ul>
    </div>
  </section>

  <!-- ============ PAGE 5: FLOWERS ============ -->
  <section class="page" id="page-flowers" data-page="flowers">
    <div class="subpage-header">
      <button class="back-btn" data-back aria-label="Back to menu">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <h2 class="subpage-title">Flowers</h2>
    </div>
    <div class="subpage-body">
      <div class="bouquet-stage" id="bouquet-stage"></div>
      <div id="flower-notes"></div>
    </div>
  </section>

  <!-- ============ PAGE 6: CAKE + LETTER FINALE ============ -->
  <section class="page" id="page-finale" data-page="finale">
    <div class="subpage-header" style="border-bottom:none;">
      <button class="back-btn" data-back aria-label="Back to menu">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
    </div>
    <div class="finale-stage">
      <div class="finale-cake-slot" id="finale-cake-slot">
        <button class="cake-tap-zone" id="finale-cake-btn" aria-label="Blow out the candle">
          <div class="cake-wrap" id="finale-cake"></div>
        </button>
      </div>
      <div class="finale-message" id="finale-message">
        <p class="finale-message-title">happy birthday, noy</p>
        <p class="finale-message-body" id="finale-message-body"></p>
      </div>
    </div>
    <p class="finale-hint" id="finale-hint">tap the candle to blow it out</p>
    <audio id="hbd-audio" preload="none"></audio>
  </section>

</div>

<!-- Lightbox for photo enlarge -->
<div class="lightbox" id="lightbox">
  <button class="lightbox-close" id="lightbox-close" aria-label="Close">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
  </button>
  <img id="lightbox-img" src="" alt="">
</div>

<script src="assets/media.js"></script>
<script src="script.js"></script>
</body>
</html>
